Section "Device"
    Identifier     "NvidiaGPU"
    Driver         "nvidia"
    Option         "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Monitor"
    Identifier     "DummyMonitor"
    HorizSync      28.0 - 80.0
    VertRefresh    48.0 - 120.0
EndSection

Section "Screen"
    Identifier     "DefaultScreen"
    Device         "NvidiaGPU"
    Monitor        "DummyMonitor"
    DefaultDepth   24
    SubSection     "Display"
        Depth      24
        Modes      "1920x1080"
    EndSubSection
EndSection
